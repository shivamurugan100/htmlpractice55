
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking</title>
    <link rel="stylesheet" href="movie.css">
</head>
<body>

    <div class="container">
        <h1>🎬 Movie Ticket Booking</h1>

        <form id="bookingForm">
            <label>Select Movie</label>
            <select id="movie" required>
                <option value="150">Leo - ₹150</option>
                <option value="200">Vikram - ₹200</option>
                <option value="250">Jailer - ₹250</option>
            </select>

            <label>Showtime</label>
            <select id="showtime" required>
                <option value="10:00 AM">10:00 AM</option>
                <option value="2:00 PM">2:00 PM</option>
                <option value="6:00 PM">6:00 PM</option>
            </select>

            <label>Number of Tickets</label>
            <input type="number" id="quantity"
                   min="1" step="1" value="1" required>

            <label>Email Address</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>

            <h3 id="total">Total: ₹150</h3>

            <button type="submit" id="bookButton">
                Book Tickets
            </button>

            <button type="reset" class="reset">
                Reset Form
            </button>
        </form>

        <p id="message" role="status"></p>

        <h2>Your Bookings</h2>
        <p>Total Bookings: <span id="count">0</span></p>

        <input type="text" id="search"
               placeholder="Search by movie or email" autocomplete="off">

        <div id="bookingList"></div>
    </div>

    <script src="movie.js"></script>
</body>
</html>
