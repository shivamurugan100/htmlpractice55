
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking</title>
    <link rel="stylesheet" href="movie.css">
</head>
<body>

    <header>
        <h1>Movie Ticket Booking</h1>

        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#booked">Book Tickets</a></li>
                <li><a href="#bookings">My Bookings</a></li>
            </ul>
        </nav>
    </header>

    <main id="home">
        <section class="welcome">

        </section>

        <div class="booking-layout">
            <section id="booked" class="booking-form">
                <!-- JavaScript inserts the booking form here -->
            </section>

            <section id="bookings" class="bookings-list">
                <!-- JavaScript inserts the booking list here -->
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Movie Ticket Booking</p>
    </footer>

    <script src="movie.js"></script>

</html>
