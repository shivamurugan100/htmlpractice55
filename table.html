<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seminar schedule</title>
</head>
<body>
<table border="1"><!--outermost border size and default cell border-->
    <tr>
        <th rowspan="3">Day</th>
        <th colspan="3">Seminar</th>
    </tr>
    <tr>
        <th colspan="2">Schedule</th>
        <th rowspan="2">Topic</th>
    </tr>
    <tr>
        <th>Begin</th>
        <th>End</th>
    </tr>
    <tr>
        <td rowspan="2">Monday</td>
        <td rowspan="2">8:00am</td>
        <td rowspan="2">5:00pm</td>
        <td>Introduction to XML</td>
    </tr>
    <tr>
        <td>Validity:DTD and Relax NG</td>
    </tr>
    <tr>
        <td rowspan="4">Tuesday</td><!--including this tr 3 more-->
        <td>8:00am</td>
        <td>11:00am</td>
        <td rowspan="2" style="padding: 7px;">XPath</td><!--style padding expands this td bottomwise to the next tr space-->
    </tr>
    <tr>
        <td rowspan="2">11:00am</td>
        <td rowspan="2">2:00pm</td>
    </tr>
    <tr>
        <td rowspan="2">XSL Transformations</td><!--this tr is invisible and occupies the next 2pm,5pm row too-->
    </tr>
    <tr>
        <td>2:00pm</td>
        <td>5:00pm</td>
    </tr>
    <tr>
        <td>Wednesday</td>
        <td>8:00am</td>
        <td>12:00pm</td>
        <td>XSL Formatting Objects</td>
    </tr>
</table>
</body>
</html>
